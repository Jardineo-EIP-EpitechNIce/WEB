name: Web CI - Lint & Build

# Ce workflow vérifie le site Next.js avant merge
# Se déclenche sur push/PR vers dev et main
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build for production
        run: npm run build
